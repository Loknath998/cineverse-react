name: Deploy CineVerse

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Enable npm bin links
        run: npm config set bin-links true

      - name: Install dependencies
        run: npm install --include=dev

      - name: Check React Scripts
        run: |
          echo "Checking react-scripts..."
          npm ls react-scripts
          ls -la node_modules/.bin/ | grep react

      - name: Build CineVerse
        run: npm run build
        env:
          REACT_APP_TMDB_API_KEY: ${{ secrets.REACT_APP_TMDB_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4